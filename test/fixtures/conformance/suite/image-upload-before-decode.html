<script>
function texturePixel(img, x, y) {
  var gl = document.createElement("canvas").getContext("webgl");
  gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
  var texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.bindFramebuffer(gl.FRAMEBUFFER, gl.createFramebuffer());
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  var px = new Uint8Array(4);
  gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return Array.prototype.slice.call(px);
}
function near(px, rgb, tolerance) {
  return Math.abs(px[0] - rgb[0]) <= tolerance && Math.abs(px[1] - rgb[1]) <= tolerance && Math.abs(px[2] - rgb[2]) <= tolerance;
}
// While a large JPEG decodes, the page uploads it and starts decode() on
// every tick. Early uploads get nothing and are not remembered, and decode()
// resolves only once the pixels are there: the first upload after it, and
// the upload after load, have the image's pixels.
var img = new Image();
var loaded = false;
var decodedChecked = false;
function check(when) {
  var px = texturePixel(img, 8, 8);
  if (near(px, [0, 0, 200], 12)) testPassed("upload " + when + " has the pixels"); else testFailed("upload " + when + ": " + px);
}
function poll() {
  if (loaded) return;
  try { texturePixel(img, 0, 0); } catch (e) {}
  img.decode().then(function () {
    if (decodedChecked) return;
    decodedChecked = true;
    check("after decode()");
  }, function () {});
  setTimeout(poll, 0);
}
img.onload = function () {
  loaded = true;
  check("after load");
  setTimeout(function () {
    if (!decodedChecked) testFailed("decode() never resolved");
    finishTest();
  }, 0);
};
img.onerror = function () { testFailed("image failed to load"); finishTest(); };
