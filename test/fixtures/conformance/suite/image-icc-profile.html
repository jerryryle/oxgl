<script>
// An 8x8 JPEG storing rgb(200, 100, 50) with a Display P3 profile, which a
// color-managed decode turns into about rgb(215, 93, 31). WebGL uploads
// ignore the profile; a 2D canvas applies it.
var img = new Image();
img.onload = function () {
  var near = function (px, rgb, tolerance) {
    return Math.abs(px[0] - rgb[0]) <= tolerance && Math.abs(px[1] - rgb[1]) <= tolerance && Math.abs(px[2] - rgb[2]) <= tolerance;
  };
  var ctx = document.createElement("canvas").getContext("2d");
  ctx.drawImage(img, 0, 0);
  var managed = ctx.getImageData(4, 4, 1, 1).data;
  if (!near(managed, [200, 100, 50], 8)) testPassed("2D drawing applies the profile"); else testFailed("2D pixels " + Array.prototype.slice.call(managed));

  var gl = document.createElement("canvas").getContext("webgl");
  gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
  var texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.bindFramebuffer(gl.FRAMEBUFFER, gl.createFramebuffer());
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  var stored = new Uint8Array(4);
  gl.readPixels(4, 4, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, stored);
  if (near(stored, [200, 100, 50], 4)) testPassed("upload ignores the profile"); else testFailed("uploaded pixels " + Array.prototype.slice.call(stored));
  finishTest();
};
img.onerror = function () { testFailed("image failed to load"); finishTest(); };
