<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>three</title>
<script type="importmap">
{ "imports": { "three": "../build/three.module.js", "three/addons/": "./jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// UUIDs draw from the unseeded random, so creating objects leaves the
// seeded sequence where it was.
const expected = Math._seedPeek();
new THREE.Object3D();
if (Math.random() !== expected) console.error('creating an Object3D drew from the seeded Math.random');

const renderer = new THREE.WebGLRenderer();
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100);
new OrbitControls(camera, renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color().setRGB(0, 128 / 255, 1, THREE.SRGBColorSpace);
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
</body>
</html>
