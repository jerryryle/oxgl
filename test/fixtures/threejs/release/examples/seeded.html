<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>seeded</title></head>
<body>
<script type="module">
const gl = document.body.appendChild(Object.assign(document.createElement('canvas'), { width: innerWidth, height: innerHeight })).getContext('webgl');
const color = [Math.random(), Math.random(), Math.random(), 1];
requestAnimationFrame(() => {
  gl.clearColor(...color);
  gl.clear(gl.COLOR_BUFFER_BIT);
});
</script>
</body>
</html>
