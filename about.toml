# cargo-about configuration for THIRD_PARTY_NOTICES (see scripts/notices.mjs).
# Notices cover crates compiled into the addon, so build- and dev-only crates
# are left out. The accepted list mirrors the allowlist in deny.toml.
accepted = [
    "BSD-3-Clause",
    "BSD-2-Clause",
    "MIT",
    "ISC",
    "Zlib",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "NCSA",
    "Spencer-94",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# oxgl's own crates are covered by LICENSE.
private = { ignore = true }
