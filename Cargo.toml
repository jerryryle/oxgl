[workspace]
resolver = "3"
members = ["crates/oxgl-sys", "crates/oxgl-core", "crates/oxgl-node"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
panic = "unwind"
lto = true
strip = "symbols"
