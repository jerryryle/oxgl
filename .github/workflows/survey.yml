# Scratch workflow (never merged): Windows arm64 crash hunt with minidumps.
name: survey
on:
  push:
    branches: [survey/port]
permissions:
  contents: read
jobs:
  crash-hunt:
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ffmpeg
        run: |
          curl -sSfL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ffmpeg.zip -d "$RUNNER_TEMP/ffmpeg" && rm ffmpeg.zip
          dirname "$(find "$RUNNER_TEMP/ffmpeg" -name ffmpeg.exe | head -1)" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      - name: ANGLE symbols
        run: |
          base=https://github.com/jerryryle/oxgl-angle/releases/download/angle-8078.4
          curl -sSfLO "$base/angle-windows-arm64-symbols.tar.xz" && curl -sSfLO "$base/SHA256SUMS"
          grep windows-arm64-symbols SHA256SUMS | sed 's#\./##' | sha256sum -c
          syms="$(cygpath -u "$RUNNER_TEMP")/syms"
          mkdir -p "$syms" && (cd "$syms" && tar -xJf "$OLDPWD/angle-windows-arm64-symbols.tar.xz")
          find "$syms" -name '*.pdb' | head; find target -name '*.pdb' | head
      - name: Run crash-prone pages under cdb
        env:
          OXGL_BACKEND: software
        run: |
          set +e +o pipefail
          temp="$(cygpath -u "$RUNNER_TEMP")"
          mkdir -p "$temp/dumps" "$temp/cdb"
          cdb=$(find "/c/Program Files (x86)/Windows Kits/10/Debuggers" -iname cdb.exe 2>/dev/null | grep -i arm64 | head -1)
          echo "cdb: $cdb"
          [ -n "$cdb" ] || { echo "cdb not found"; exit 1; }
          # Full page heap for node.exe: a freed heap block becomes inaccessible,
          # so a use-after-free faults at once, and !heap -p -a names the stack
          # that freed it.
          gflags="$(dirname "$cdb")/gflags.exe"
          [ -x "$gflags" ] || { echo "gflags not found next to cdb"; exit 1; }
          # -i, not /i: Git Bash rewrites an argument starting with / as a path.
          "$gflags" -i node.exe +hpa
          "$gflags" -i node.exe
          syms="$(cygpath -w "$temp/syms");srv*$(cygpath -w "$temp/symcache")*https://msdl.microsoft.com/download/symbols"
          while IFS= read -r t; do syms="$syms;$(cygpath -w "$PWD/$t")"; done < <(find target -name '*.pdb' -exec dirname {} \; | sort -u)
          node="$(cygpath -w "$(command -v node)")"
          # Forward slashes: cdb reads backslashes in quoted command strings as escapes.
          dumpdir="$(cygpath -m "$temp/dumps")"
          # On every first-chance access violation in the runner or a page
          # process (-o): print the stack, write a minidump, then pass the
          # exception on, so the process ends as it would without cdb.
          # sxi ibp: never stop at a process's initial breakpoint (page processes
          # start under the debugger too), so cdb never waits for input.
          # No -g: cdb runs -c at its first prompt, which must be the runner's
          # initial breakpoint rather than the first exception.
          # sxn cpr/epr: report each process's start and exit (with its exit
          # code) without stopping.
          commands="sxi ibp; sxn cpr; sxn epr; sxe -c \"r; !address @x11; !heap -p -a @x11; kn 30; .frame 2; dv /t /v; .dump /mp /u $dumpdir/av.dmp; gn\" av; g"
          specs=("image_bitmap_from_image_bitmap/" "tex-2d-rgb10_a2-rgba-unsigned_int_2_10_10_10_rev.html")
          for round in 1 2 3 4 5 6; do
            for i in "${!specs[@]}"; do
              log="$temp/cdb/$round-$i.log"
              printf '%(%T)T == round %s spec %s (%s): starting\n' -1 "$round" "$i" "${specs[$i]}"
              # Streamed into the job log as it happens, each line timestamped,
              # and kept whole in $log for the artifact.
              timeout -k 10 900 "$cdb" -o -G -y "$syms" -c "$commands" "$node" conformance/run.mjs --suite webgl2 --filter="${specs[$i]}" < /dev/null 2>&1 \
                | tee "$log" | while IFS= read -r line; do printf '%(%T)T %s\n' -1 "$line"; done
              rc=${PIPESTATUS[0]}
              printf '%(%T)T == round %s spec %s: cdb exit %s\n' -1 "$round" "$i" "$rc"
              # 124: timed out, so cdb stalled; its log says where. 30: cdb
              # quit at a second-chance exception, the crash we are after.
              [ "$rc" -eq 124 ] || [ "$rc" -eq 30 ] && break 2
            done
            n=$(find "$temp/dumps" -name '*.dmp' | wc -l)
            echo "round $round: $n dumps"
            [ "$n" -ge 2 ] && break
          done
          grep -h -B2 -A150 "Access violation" "$temp"/cdb/*.log | head -600
          exit 0
      - name: Symbolize dumps
        if: always()
        run: |
          set +e +o pipefail
          cdb=$(find "/c/Program Files (x86)/Windows Kits/10/Debuggers" -iname cdb.exe 2>/dev/null | grep -i arm64 | head -1)
          echo "cdb: $cdb"
          [ -n "$cdb" ] || exit 0
          temp="$(cygpath -u "$RUNNER_TEMP")"
          syms="$(cygpath -w "$temp/syms");$(cygpath -w "$PWD/dist");srv*$(cygpath -w "$temp/symcache")*https://msdl.microsoft.com/download/symbols"
          while IFS= read -r t; do syms="$syms;$(cygpath -w "$PWD/$t")"; done < <(find target -name '*.pdb' -exec dirname {} \; | sort -u)
          echo "symbol path: $syms"
          n=0
          while IFS= read -r d; do
            n=$((n + 1)); [ "$n" -le 6 ] || break
            echo "===== $d"
            "$cdb" -z "$(cygpath -w "$d")" -y "$syms" -c ".ecxr; kn 40; !analyze -v; q" < /dev/null 2>&1 | grep -vE '^\*|^ *$' | head -150
          done < <(find "$temp/dumps" -name '*.dmp')
          echo "$n dumps"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dumps
          path: |
            ${{ runner.temp }}/dumps
            ${{ runner.temp }}/cdb
          if-no-files-found: ignore
