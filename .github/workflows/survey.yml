# Scratch workflow (never merged): Windows arm64 crash hunt with minidumps.
name: survey
on:
  push:
    branches: [survey/port]
permissions:
  contents: read
jobs:
  crash-hunt:
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ffmpeg
        run: |
          curl -sSfL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ffmpeg.zip -d "$RUNNER_TEMP/ffmpeg" && rm ffmpeg.zip
          dirname "$(find "$RUNNER_TEMP/ffmpeg" -name ffmpeg.exe | head -1)" >> "$GITHUB_PATH"
      - run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
      - name: ANGLE symbols
        run: |
          base=https://github.com/jerryryle/oxgl-angle/releases/download/angle-8078.4
          curl -sSfLO "$base/angle-windows-arm64-symbols.tar.xz" && curl -sSfLO "$base/SHA256SUMS"
          grep windows-arm64-symbols SHA256SUMS | sed 's#\./##' | sha256sum -c
          syms="$(cygpath -u "$RUNNER_TEMP")/syms"
          mkdir -p "$syms" && (cd "$syms" && tar -xJf "$OLDPWD/angle-windows-arm64-symbols.tar.xz")
          find "$syms" -name '*.pdb' | head; find target -name '*.pdb' | head
      - name: Enable minidumps
        shell: pwsh
        run: |
          $k = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $k -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpFolder -Value "$env:RUNNER_TEMP\dumps" -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $k -Name DumpCount -Value 100 -PropertyType DWord -Force | Out-Null
      - name: Re-run the crashing pages
        env:
          OXGL_BACKEND: software
        run: |
          w1="conformance/ogles/GL/swizzlers/swizzlers_073_to_080.html deqp/data/gles2/shaders/constants.html"
          w2="copy-tex-image-2d-formats.html shaderoperator/selection.html etc2_eac_srgb8_alpha8_npot.html deqp/functional/gles3/buffercopy.html tex-2d-rgb10_a2-rgba-unsigned_int_2_10_10_10_rev.html image_bitmap_from_image_bitmap/ image_bitmap_from_blob/tex-2d-rgba16f"
          for _ in 1 2 3; do
            for p in $w1; do npm run -s conformance -- --suite webgl1 --filter="$p" 2>&1 | grep -E "expected|webgl1:" ; done
            for p in $w2; do npm run -s conformance -- --suite webgl2 --filter="$p" 2>&1 | grep -E "expected|webgl2:" ; done
          done
          ls "$(cygpath -u "$RUNNER_TEMP")/dumps" || true
      - name: Symbolize dumps
        if: always()
        run: |
          cdb=$(find "/c/Program Files (x86)/Windows Kits/10/Debuggers" -iname cdb.exe 2>/dev/null | grep -i arm64 | head -1)
          echo "cdb: $cdb"
          [ -n "$cdb" ] || exit 0
          temp="$(cygpath -u "$RUNNER_TEMP")"
          syms="$(cygpath -w "$temp/syms");$(cygpath -w "$PWD/target/release");$(cygpath -w "$PWD/dist");srv*$(cygpath -w "$temp/symcache")*https://msdl.microsoft.com/download/symbols"
          for t in $(find target -name '*.pdb' -printf '%h\n' | sort -u); do syms="$syms;$(cygpath -w "$PWD/$t")"; done
          n=0
          for d in "$temp"/dumps/*.dmp; do
            [ -f "$d" ] || continue; n=$((n+1)); [ $n -le 6 ] || break
            echo "===== $d"
            "$cdb" -z "$(cygpath -w "$d")" -y "$syms" -c ".ecxr; kn 40; !analyze -v; q" 2>&1 | grep -vE "^\*|^ *$" | head -150
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dumps
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore
