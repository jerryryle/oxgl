# The checks every change must pass (openspec continuous-integration spec).
# Branch protection requires only the aggregate `ci` job, so jobs can be added
# or renamed without touching repository settings. The jobs that build or test
# oxgl are skipped for changes that cannot affect them (see `changes`).
# CONTRIBUTING.md explains how to reproduce each job locally.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # angle-bump.yml dispatches runs on its branch, and merge-bump on main: runs
  # started with the default token trigger no push or pull_request event.
  workflow_dispatch:

concurrency:
  # Runs off main (a pull request's, or manual runs on one branch) share a
  # group, so a newer run cancels the old one. Each run on main gets its own
  # group: GitHub cancels a queued run whenever a newer one joins its group,
  # which would skip commits on main.
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # License tools, pinned once here; README.md points at these values.
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_ABOUT_VERSION: "0.9.3"
  # Nightly is needed only for -Zsanitizer and -Zbuild-std; bump deliberately.
  ASAN_NIGHTLY: nightly-2026-10-20
  # Workflow linters. Dependabot doesn't bump these; CONTRIBUTING.md refers here.
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: "1.31.1"

jobs:
  # Whether the jobs that build or test oxgl (check, node-range, asan,
  # conformance, threejs, gpu) are needed. heavy is false only when every changed file
  # is on the skip list below or is a results page file. The list may name only
  # files that no build, lint or test step reads; anything else, including a new
  # path, runs every job. When the changed files can't be determined (a new
  # branch, or the diff fails), heavy is true. page is true when heavy is false
  # and a results page file changed: repo-checks then checks the page builder,
  # and the results job rebuilds the page from the last main run's reports
  # (openspec results-page).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.match.outputs.heavy }}
      page: ${{ steps.match.outputs.page }}
      # Whether this run releases: a run on main whose version npm doesn't
      # have yet (openspec release). Only then do the check jobs keep their
      # packages and the release job run.
      release: ${{ steps.release.outputs.release || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: match
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          heavy=true page=false range=
          case "$EVENT" in
            pull_request) range="$BASE...$HEAD" ;;
            push) [[ "$BEFORE" =~ ^0+$ ]] || range="$BEFORE..$SHA" ;;
          esac
          # --no-renames lists both sides of a rename, so moving a file onto
          # the skip list still counts the path it left.
          if [ -n "$range" ] && files="$(git diff --no-renames --name-only "$range")" && [ -n "$files" ]; then
            heavy=false
            while IFS= read -r f; do
              case "$f" in
                *.md|openspec/*|.claude/*|assets/*|LICENSE|.editorconfig|.github/dependabot.yml|.github/zizmor.yml|.github/actionlint.yaml) ;;
                scripts/results-page.html|scripts/results-page.mjs|test/results-page.test.mjs) page=true ;;
                *) heavy=true; break ;;
              esac
            done <<< "$files"
          fi
          [ "$heavy" = false ] || page=false
          { echo "heavy=$heavy"; echo "page=$page"; } | tee -a "$GITHUB_OUTPUT"
      - id: release
        if: github.ref == 'refs/heads/main'
        run: |
          version="$(jq -r .version package.json)"
          # A failed lookup counts as unreleased; the release then checks each
          # package itself.
          if npm view "@oxgl-js/oxgl@$version" version >/dev/null 2>&1; then release=false; else release=true; fi
          echo "release=$release" | tee -a "$GITHUB_OUTPUT"

  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go's checksum database verifies the module download.
      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          "$(go env GOPATH)/bin/actionlint"
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor@${{ env.ZIZMOR_VERSION }}
          fallback: none
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml .github/workflows

  check:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conformance runner, and its harness tests, decode videos with ffmpeg.
      - name: Install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install -y --no-progress ffmpeg ;;
          esac
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # No restore-keys: falling back to an older entry would carry its
          # stale target/ forward, so the cache would only ever grow.
          key: cargo-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # oxgl-sys/build.rs verifies the bundle's digest when it downloads it.
      # A restored cache entry is used as-is. Cache entries a pull request
      # writes are visible only to that pull request, so only runs on main can
      # write one that other branches restore.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      - run: npm ci
      - run: npm run lint:rust
      - run: npm run lint:js
      - run: cargo test --workspace --exclude oxgl-node --locked
      - run: npm run build
      - run: npm test
        env:
          OXGL_BACKEND: software
      # Installs the packed packages into an empty project and renders with
      # them (openspec continuous-integration, "Packed packages are
      # smoke-tested"). Every leg packs its own main tarball; only
      # ubuntu-24.04-arm keeps it, so the release has exactly one. Tarballs are
      # named exactly: the main one, oxgl-js-oxgl-<version>.tgz, matches any
      # oxgl-js-* pattern meant for the platform ones.
      - name: Pack and smoke-test the packages
        id: pack
        env:
          OS: ${{ matrix.os }}
        run: |
          node scripts/pack.mjs "$RUNNER_TEMP/packages"
          node scripts/smoke-packed.mjs "$RUNNER_TEMP/packages"
          version="$(jq -r .version package.json)"
          platform="$(node --input-type=module -e "import { platformString } from './dist/resolve-native.js'; console.log(platformString(process.platform, process.arch))")"
          [ "$OS" = ubuntu-24.04-arm ] || rm "$RUNNER_TEMP/packages/oxgl-js-oxgl-$version.tgz"
          echo "platform-tarball=$RUNNER_TEMP/packages/oxgl-js-$platform-$version.tgz" >> "$GITHUB_OUTPUT"
      - name: Require glibc 2.34 at most (Linux)
        if: runner.os == 'Linux'
        env:
          TARBALL: ${{ steps.pack.outputs.platform-tarball }}
        run: scripts/check-glibc.sh "$TARBALL"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.release == 'true'
        with:
          name: packages-${{ matrix.os }}
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          # Long enough to rerun a failed release job.
          retention-days: 7

  # Host-independent checks, run once.
  repo-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: python3 angle/scripts/check_pin.py
      - run: python3 angle/scripts/test_bump.py
      # The results page builder needs no native build, so it is checked here
      # on every change: a page-only change runs no other job that would
      # (openspec results-page).
      - run: npm ci
      - name: Lint and test the results page builder
        run: |
          npx eslint scripts/results-page.mjs test/results-page.test.mjs
          node --test test/results-page.test.mjs
      # Checksums come from install-action's manifest; with no fallback, a
      # version it does not list fails here instead of downloading unverified.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-about@${{ env.CARGO_ABOUT_VERSION }}
          fallback: none
      - run: npm run lint:licenses

  # Both ends of `engines`. N-API makes the addon independent of the Node
  # version, so Linux alone covers it. The build tooling needs a newer Node
  # than the engines floor, so build on 24 and test on each version.
  node-range:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.2, 26]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conformance runner, and its harness tests, decode videos with ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Its own key: this job builds only release, and sharing check's key
          # would let whichever job saves first own the entry.
          key: cargo-node-range-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        env:
          OXGL_BACKEND: software

  # Rust test suites under AddressSanitizer + LeakSanitizer, on both Linux
  # architectures (README.md, CONTRIBUTING.md).
  asan:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # No -Zbuild-std on aarch64: it instruments compiler_builtins, whose
          # outline atomics __asan_init calls before shadow memory exists, so
          # every test binary segfaults at startup. The prebuilt std is
          # uninstrumented; heap errors are still caught through ASan's
          # allocator. fast_unwind_on_malloc=0: ANGLE's arm64 build signs
          # return addresses, which the frame-pointer unwinder cannot follow,
          # so suppressions would never see the ANGLE frames.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build-std: false
            asan-options: ":fast_unwind_on_malloc=0"
          # x64 rebuilds std instrumented, which needs rust-src.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build-std: true
            asan-options: ""
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
      # Doctests are built by rustdoc, which reads only RUSTDOCFLAGS.
      RUSTDOCFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:detect_stack_use_after_return=1${{ matrix.asan-options }}
      # Builds tests against the unstripped libraries of the pinned symbols
      # archive (verified like the bundle), so suppressions can name ANGLE
      # functions.
      OXGL_ANGLE_SYMBOLS: "1"
      # Absolute: cargo runs each test binary from its package directory.
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly
        env:
          BUILD_STD: ${{ matrix.build-std }}
        run: |
          args=()
          [ "$BUILD_STD" = true ] && args+=(--component rust-src)
          rustup toolchain install "$ASAN_NIGHTLY" --profile minimal "${args[@]}"
      # LeakSanitizer matches suppressions against symbolized frames.
      - name: Locate llvm-symbolizer
        run: |
          symbolizer=$(command -v llvm-symbolizer || find /usr/lib/llvm-*/bin -name llvm-symbolizer | sort -V | tail -1)
          test -x "$symbolizer"
          echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-asan-${{ runner.arch }}-${{ env.ASAN_NIGHTLY }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      # oxgl-node is a Node addon whose tests run under Node, not cargo.
      - env:
          TARGET: ${{ matrix.target }}
          BUILD_STD: ${{ matrix.build-std }}
        run: |
          args=()
          [ "$BUILD_STD" = true ] && args+=(-Zbuild-std)
          cargo +"$ASAN_NIGHTLY" test --workspace --exclude oxgl-node --locked "${args[@]}" --target "$TARGET"

  # Extension point: GPU coverage on a self-hosted runner, enabled by setting
  # the OXGL_GPU_RUNNER repository variable to 'true'. Not required by `ci`.
  gpu:
    needs: changes
    if: vars.OXGL_GPU_RUNNER == 'true' && needs.changes.outputs.heavy == 'true'
    runs-on: [self-hosted, oxgl-gpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Both Khronos conformance suites on every supported platform, judged against
  # the conformance/expectations.txt entries that apply there (openspec
  # conformance-testing). Each platform and suite runs in parallel and uploads
  # its report whether it passes or fails.
  conformance:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-15, windows-2025, windows-11-arm]
        suite: [webgl1, webgl2]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conformance runner decodes videos with ffmpeg.
      - name: Install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install -y --no-progress ffmpeg ;;
          esac
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      # The suite is fetched by its pinned commit; the cache is keyed by the pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/conformance
          key: conformance-suite-${{ hashFiles('conformance/suite.json') }}
      - run: npm ci
      - run: npm run build
      # macos-15 runners are slow and variable: passing pages went up to 53 s
      # between results there, so macOS gets a longer limit, which costs time
      # only for pages that stop without finishing.
      - run: |
          args=(--suite "$SUITE")
          [ "$RUNNER_OS" = macOS ] && args+=(--timeout 180)
          npm run conformance -- "${args[@]}"
        env:
          SUITE: ${{ matrix.suite }}
          OXGL_BACKEND: software
      # Artifact names must be unique within a run, hence the platform and suite suffix.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-results-${{ matrix.os }}-${{ matrix.suite }}
          path: conformance-results.json

  # three.js r186's own WebGL examples, each frame judged against the
  # release's reference screenshot and threejs/expectations.txt (openspec
  # threejs-examples). Runs alongside the conformance jobs; uploads its report
  # and failing examples' images whether it passes or fails.
  threejs:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner refuses to start without ffmpeg, as the conformance runner does.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ubuntu-24.04-arm-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      # The release is fetched by its pinned commit; the cache is keyed by the pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/threejs
          key: threejs-release-${{ hashFiles('threejs/pin.json') }}
      - run: npm ci
      - run: npm run build
      - run: npm run threejs
        env:
          OXGL_BACKEND: software
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: threejs-results
          path: |
            threejs-results.json
            threejs-output/
          if-no-files-found: ignore

  # The one check branch protection requires. The jobs that build or test oxgl
  # may be skipped only when `changes` found them unneeded; any other skip (an
  # upstream failure, a broken `if:`) fails the check.
  ci:
    if: always()
    needs: [changes, workflow-lint, check, repo-checks, node-range, asan, conformance, threejs]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            (.changes.outputs.heavy == "false") as $skippable
            | all(to_entries[];
                .value.result == "success"
                or (.value.result == "skipped" and $skippable
                    and (.key | IN("check", "node-range", "asan", "conformance", "threejs"))))'

  # Publishes a version npm doesn't have yet, from the tarballs this run's
  # check jobs packed and smoke-tested (openspec release). Trusted publishing:
  # npm accepts this job's OIDC token for the `npm` environment, which only
  # main may deploy to, so no npm token exists. A rerun publishes only what a
  # failed run left out.
  release:
    needs: [changes, check, ci]
    if: needs.changes.outputs.release == 'true' && needs.check.result == 'success' && needs.ci.result == 'success'
    runs-on: ubuntu-24.04
    environment: npm
    # Serializes overlapping runs on main; never cancel a publish.
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 has
      # bundled since 24.5.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: packages
          merge-multiple: true
      - run: node scripts/release.mjs packages
        env:
          GH_TOKEN: ${{ github.token }}

  # Merges angle-bump.yml's pull request when this manual run on its branch
  # passed, but only when the branch is exactly the change main's bump script
  # makes to main for the oxgl-angle release its commit names (openspec
  # angle-distribution). Anything else, such as a fix pushed to the branch,
  # waits for a person. The tag comes from the commit, so a newer oxgl-angle
  # release during this run doesn't hold up the merge. A merge with the
  # default token triggers no push run, so this starts the run on main that
  # releases.
  merge-bump:
    needs: ci
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/angle-bump' && needs.ci.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Merge the bump pull request and release from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(git log -1 --format=%s HEAD | sed -nE 's/^Pin oxgl-angle (angle-[0-9]+\.[0-9]+)$/\1/p')"
          if [ -z "$tag" ] || [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::angle-bump is not one angle-bump.yml commit on main; merge it by hand"
            exit 0
          fi
          # Rerun main's bump on main's tree and compare whole trees, so no
          # other path can differ.
          expected="$RUNNER_TEMP/expected"
          git worktree add -q --detach "$expected" origin/main
          (cd "$expected" && angle/scripts/bump.sh "$tag" > /dev/null)
          git -C "$expected" add -A
          if [ "$(git -C "$expected" write-tree)" != "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "::notice::angle-bump is not exactly main's bump to $tag; merge it by hand"
            exit 0
          fi
          gh pr merge angle-bump --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$GITHUB_SHA"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main

  # Builds the results page (openspec results-page) after the suites, also
  # when they fail. A full run uses its own reports; a page-only change uses
  # the latest main run's, since its own run produces none. Not part of `ci`:
  # a page-builder bug must not block merges, and repo-checks tests the
  # builder.
  results:
    needs: [changes, conformance, threejs]
    if: ${{ !cancelled() && (needs.changes.outputs.heavy == 'true' || needs.changes.outputs.page == 'true') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      built: ${{ steps.source.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Find the reports
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE: ${{ needs.changes.outputs.page }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$PAGE" != true ]; then
            { echo "found=true"; echo "run-id=$RUN_ID"; echo "commit=$SHA"; } | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          # The newest completed run of this repository's own main (a push or a
          # manual run: a pull request from a fork's branch named main must not
          # count) with conformance reports that haven't expired.
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.event == \"push\" or .event == \"workflow_dispatch\")
              | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\") | .id")"
          for id in $runs; do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired | not) | select(.name | startswith("conformance-results-"))] | length')"
            if [ "$count" != 0 ]; then
              commit="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq .head_sha)"
              { echo "found=true"; echo "run-id=$id"; echo "commit=$commit"; } | tee -a "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice::No main run has unexpired reports (they last 90 days), so the results page is not rebuilt."
          echo "found=false" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.page != 'true'
        with:
          pattern: "{conformance-results-*,threejs-results}"
          path: reports
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.page == 'true' && steps.source.outputs.found == 'true'
        with:
          pattern: "{conformance-results-*,threejs-results}"
          path: reports
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Build the page
        if: steps.source.outputs.found == 'true'
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          mkdir -p reports
          node scripts/results-page.mjs --commit "$COMMIT" --page-commit "$GITHUB_SHA" reports site/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.source.outputs.found == 'true'
        with:
          name: results-page
          path: site/index.html
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && steps.source.outputs.found == 'true'
        with:
          path: site

  # Publishes the page to GitHub Pages, from main only. The only job with
  # pages: write and id-token: write.
  pages:
    needs: results
    if: github.ref == 'refs/heads/main' && needs.results.outputs.built == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Deploys one at a time; never cancel one that has started.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
