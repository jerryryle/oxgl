# The checks every change must pass (openspec continuous-integration spec).
# Branch protection requires only the aggregate `ci` job, so jobs can be added
# or renamed without touching repository settings. CONTRIBUTING.md explains
# how to reproduce each job locally.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # A pull request's runs share a group, so a new push cancels the old run.
  # Each push to main gets its own group: GitHub cancels a queued run whenever
  # a newer one joins its group, which would skip commits on main.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # License tools, pinned once here; README.md points at these values.
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_ABOUT_VERSION: "0.9.3"
  # Nightly is needed only for -Zsanitizer and -Zbuild-std; bump deliberately.
  ASAN_NIGHTLY: nightly-2026-10-20
  # Workflow linters. Dependabot doesn't bump these; CONTRIBUTING.md refers here.
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: "1.31.1"

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go's checksum database verifies the module download.
      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          "$(go env GOPATH)/bin/actionlint"
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor@${{ env.ZIZMOR_VERSION }}
          fallback: none
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml .github/workflows

  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux arm64 is the only supported platform for now (see README.md).
        os: [ubuntu-24.04-arm]
        # PLATFORM-FOCUS: re-enable
        # os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conformance runner, and its harness tests, decode videos with ffmpeg.
      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # No restore-keys: falling back to an older entry would carry its
          # stale target/ forward, so the cache would only ever grow.
          key: cargo-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # oxgl-sys/build.rs verifies the bundle's digest when it downloads it.
      # A restored cache entry is used as-is. Cache entries a pull request
      # writes are visible only to that pull request, so only runs on main can
      # write one that other branches restore.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      - run: npm ci
      - run: npm run lint:rust
      - run: npm run lint:js
      - run: cargo test --workspace --exclude oxgl-node --locked
      - run: npm run build
      - run: npm test
        env:
          OXGL_BACKEND: software

  # Host-independent checks, run once.
  repo-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: python3 angle/scripts/check_pin.py
      # Checksums come from install-action's manifest; with no fallback, a
      # version it does not list fails here instead of downloading unverified.
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-about@${{ env.CARGO_ABOUT_VERSION }}
          fallback: none
      - run: npm run lint:licenses

  # Both ends of `engines`. N-API makes the addon independent of the Node
  # version, so Linux alone covers it. The build tooling needs a newer Node
  # than the engines floor, so build on 24 and test on each version.
  node-range:
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.2, 26]
    runs-on: ubuntu-24.04-arm
    # PLATFORM-FOCUS: re-enable
    # runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conformance runner, and its harness tests, decode videos with ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Its own key: this job builds only release, and sharing check's key
          # would let whichever job saves first own the entry.
          key: cargo-node-range-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        env:
          OXGL_BACKEND: software

  # Rust test suites under AddressSanitizer + LeakSanitizer. ANGLE is the
  # normal stripped bundle; see design.md for why suppressions start empty.
  asan:
    runs-on: ubuntu-24.04-arm
    # PLATFORM-FOCUS: re-enable
    # runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
      # Doctests are built by rustdoc, which reads only RUSTDOCFLAGS.
      RUSTDOCFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
      # fast_unwind_on_malloc=0: ANGLE's arm64 build signs return addresses, which
      # the frame-pointer unwinder cannot follow, so suppressions would never
      # see the ANGLE frames.
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:detect_stack_use_after_return=1:fast_unwind_on_malloc=0
      # PLATFORM-FOCUS: re-enable
      # ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:detect_stack_use_after_return=1
      # Builds tests against the unstripped libraries of the pinned symbols
      # archive (verified like the bundle), so suppressions can name ANGLE
      # functions.
      OXGL_ANGLE_SYMBOLS: "1"
      # Absolute: cargo runs each test binary from its package directory.
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly
        # PLATFORM-FOCUS: re-enable (x64 rebuilds std, which needs rust-src)
        # run: rustup toolchain install "$ASAN_NIGHTLY" --profile minimal --component rust-src
        run: rustup toolchain install "$ASAN_NIGHTLY" --profile minimal
      # LeakSanitizer matches suppressions against symbolized frames.
      - name: Locate llvm-symbolizer
        run: |
          symbolizer=$(command -v llvm-symbolizer || find /usr/lib/llvm-*/bin -name llvm-symbolizer | sort -V | tail -1)
          test -x "$symbolizer"
          echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-asan-${{ runner.arch }}-${{ env.ASAN_NIGHTLY }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      # oxgl-node is a Node addon whose tests run under Node, not cargo.
      # No -Zbuild-std on aarch64: it instruments compiler_builtins, whose
      # outline atomics __asan_init calls before shadow memory exists, so every
      # test binary segfaults at startup. The prebuilt std is uninstrumented;
      # heap errors are still caught through ASan's allocator.
      # PLATFORM-FOCUS: re-enable
      #   -Zbuild-std --target x86_64-unknown-linux-gnu
      - run: >-
          cargo +"$ASAN_NIGHTLY" test --workspace --exclude oxgl-node --locked
          --target aarch64-unknown-linux-gnu

  # Extension point: GPU coverage on a self-hosted runner, enabled by setting
  # the OXGL_GPU_RUNNER repository variable to 'true'. Not required by `ci`.
  gpu:
    if: vars.OXGL_GPU_RUNNER == 'true'
    runs-on: [self-hosted, oxgl-gpu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: npm ci
      - run: npm run build
      - run: npm test

  # The one check branch protection requires.
  # Both Khronos conformance suites, judged against
  # conformance/expectations.txt (openspec conformance-testing). The suites
  # run in parallel; each uploads its report whether it passes or fails.
  conformance:
    strategy:
      fail-fast: false
      matrix:
        suite: [webgl1, webgl2]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conformance runner, and its harness tests, decode videos with ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ubuntu-24.04-arm-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      # The suite is fetched by its pinned commit; the cache is keyed by the pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/conformance
          key: conformance-suite-${{ hashFiles('conformance/suite.json') }}
      - run: npm ci
      - run: npm run build
      - run: npm run conformance -- --suite "$SUITE"
        env:
          SUITE: ${{ matrix.suite }}
          OXGL_BACKEND: software
      # Artifact names must be unique within a run, hence the suite suffix.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-results-${{ matrix.suite }}
          path: conformance-results.json

  ci:
    if: always()
    needs: [workflow-lint, check, repo-checks, node-range, asan, conformance]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
