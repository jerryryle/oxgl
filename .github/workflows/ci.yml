# The checks every change must pass (openspec continuous-integration spec).
# Branch protection and the merge queue require only the aggregate `ci` job,
# so jobs can be added or renamed without touching repository settings. Which
# jobs run depends on the event alone: a pull request runs the quick checks
# (the full checks too when labelled full-ci; adding the label starts no run),
# a merge group and a manual run the full checks, and a push to main builds
# and tests nothing: it releases what the merge group run for its commit built
# (and warms caches). See `changes`. CONTRIBUTING.md explains how to reproduce each job locally.
name: ci

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A pull request's runs, and manual runs on one branch other than main, share
  # a group, so a newer run cancels the old one. Every other run (merge groups,
  # pushes and manual runs on main) gets its own group: GitHub cancels a queued
  # run whenever a newer one joins its group.
  group: ci-${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # License tools, pinned once here; README.md points at these values.
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_ABOUT_VERSION: "0.9.3"
  # Nightly is needed only for -Zsanitizer and -Zbuild-std; bump deliberately.
  ASAN_NIGHTLY: nightly-2026-10-20
  # Workflow linters. Dependabot doesn't bump these; CONTRIBUTING.md refers here.
  ACTIONLINT_VERSION: v1.7.12
  ZIZMOR_VERSION: "1.31.1"

jobs:
  # What this run does. full: the full checks (AddressSanitizer, conformance,
  # three.js) run, in a merge group, a manual run, or a pull request labelled
  # full-ci. release: a merge group, a push to main or a manual run on main
  # whose version npm doesn't have yet (openspec release); only then do the
  # build jobs keep their packages for a week, and on main the release job
  # runs. warm-inputs, warm-rust: a push to main changed a file the download
  # caches, or the Rust build caches, are keyed on, or a manual run on main
  # (openspec continuous-integration, "Caches are warmed from main").
  changes:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.event.outputs.full }}
      release: ${{ steps.release.outputs.release || 'false' }}
      warm-inputs: ${{ steps.warm.outputs.inputs || 'false' }}
      warm-rust: ${{ steps.warm.outputs.rust || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: event
        env:
          EVENT: ${{ github.event_name }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          case "$EVENT" in
            merge_group|workflow_dispatch) full=true ;;
            pull_request) full="$FULL_CI" ;;
            *) full=false ;;
          esac
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"
      - id: release
        if: github.event_name == 'merge_group' || github.ref == 'refs/heads/main'
        run: |
          version="$(jq -r .version package.json)"
          # A failed lookup counts as unreleased; the release then checks each
          # package itself.
          if npm view "@oxgl-js/oxgl@$version" version >/dev/null 2>&1; then release=false; else release=true; fi
          echo "release=$release" | tee -a "$GITHUB_OUTPUT"
      # Caches a merge group or pull request run saves are never restored by
      # another run, so pushes to main save them. ci.yml holds ASAN_NIGHTLY,
      # which the AddressSanitizer cache key includes.
      - id: warm
        if: github.ref == 'refs/heads/main' && github.event_name != 'merge_group'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          inputs=true rust=true
          if [ "$EVENT" = push ] && ! [[ "$BEFORE" =~ ^0+$ ]] && files="$(git diff --name-only "$BEFORE..$SHA")"; then
            inputs=false rust=false
            while IFS= read -r f; do
              case "$f" in
                Cargo.lock|rust-toolchain.toml|.github/workflows/ci.yml) inputs=true rust=true ;;
                angle/bundles.toml|conformance/suite.json|threejs/pin.json|package-lock.json) inputs=true ;;
              esac
            done <<< "$files"
          fi
          { echo "inputs=$inputs"; echo "rust=$rust"; } | tee -a "$GITHUB_OUTPUT"

  workflow-lint:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go's checksum database verifies the module download.
      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          "$(go env GOPATH)/bin/actionlint"
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: zizmor@${{ env.ZIZMOR_VERSION }}
          fallback: none
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --config .github/zizmor.yml .github/workflows .github/actions

  # Builds and packs oxgl once per platform (openspec continuous-integration,
  # "Each platform is built once per run"). Every job that tests oxgl's
  # addon or JavaScript downloads these packages and unpacks them into dist/
  # with scripts/unpack-packages.mjs, so the tests and the release use the
  # same files. On a push to main it runs only to save its build cache, after
  # `caches` saved the bundle cache it shares.
  build:
    needs: [changes, caches]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (github.event_name != 'push' || needs.changes.outputs.warm-rust == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # No restore-keys: falling back to an older entry would carry its
          # stale target/ forward, so the cache would only ever grow. Its own
          # key: check builds other profiles, and sharing a key would let
          # whichever job saves first own the entry.
          key: cargo-build-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # oxgl-sys/build.rs verifies the bundle's digest when it downloads it.
      # A restored cache entry is used as-is. Cache entries a pull request
      # writes are visible only to that pull request, so only runs on main can
      # write one that other branches restore.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      - run: npm ci
      - run: npm run build
      # Installs the packed packages into an empty project and renders with
      # them (openspec continuous-integration, "Packed packages are
      # smoke-tested"). Every leg packs its own main tarball, the same
      # JavaScript on every platform; one leg, ubuntu-24.04-arm, keeps it as
      # the package-main artifact, so the run has exactly one, which every
      # test job and the release use. Tarballs are named exactly: the main
      # one, oxgl-js-oxgl-<version>.tgz, matches any oxgl-js-* pattern meant
      # for the platform ones.
      - name: Pack and smoke-test the packages
        id: pack
        env:
          OS: ${{ matrix.os }}
        run: |
          node scripts/pack.mjs "$RUNNER_TEMP/packages"
          node scripts/smoke-packed.mjs "$RUNNER_TEMP/packages"
          version="$(jq -r .version package.json)"
          platform="$(node --input-type=module -e "import { platformString } from './dist/resolve-native.js'; console.log(platformString(process.platform, process.arch))")"
          main="$RUNNER_TEMP/packages/oxgl-js-oxgl-$version.tgz"
          if [ "$OS" = ubuntu-24.04-arm ]; then
            mkdir "$RUNNER_TEMP/main" && mv "$main" "$RUNNER_TEMP/main/"
          else
            rm "$main"
          fi
          echo "platform-tarball=$RUNNER_TEMP/packages/oxgl-js-$platform-$version.tgz" >> "$GITHUB_OUTPUT"
      # The test-only addon the OpenGL ES backend legs use (openspec
      # continuous-integration, "Test addon build"): built after packing and
      # into dist-gles/, so the packed addon, which the step above checked
      # rejects OXGL_BACKEND=gles, is never this one.
      - name: Build the test-gles addon (Linux)
        if: runner.os == 'Linux'
        run: npx napi build --platform --release --manifest-path crates/oxgl-node/Cargo.toml --output-dir dist-gles --no-js --features test-gles
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: addon-linux-${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-gles
          path: dist-gles/*.node
          if-no-files-found: error
          retention-days: ${{ needs.changes.outputs.release == 'true' && 7 || 3 }}
      - name: Require glibc 2.34 at most (Linux)
        if: runner.os == 'Linux'
        env:
          TARBALL: ${{ steps.pack.outputs.platform-tarball }}
        run: scripts/check-glibc.sh "$TARBALL"
      # A release keeps them long enough to rerun a failed release job.
      # Otherwise long enough for "Re-run failed jobs" after a weekend: it
      # reruns only the failed test jobs, not this one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.os }}
          path: ${{ runner.temp }}/packages/*.tgz
          if-no-files-found: error
          retention-days: ${{ needs.changes.outputs.release == 'true' && 7 || 3 }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-24.04-arm'
        with:
          name: package-main
          path: ${{ runner.temp }}/main/*.tgz
          if-no-files-found: error
          retention-days: ${{ needs.changes.outputs.release == 'true' && 7 || 3 }}

  # Lint and the Rust tests on every platform. Needs no addon build, so it
  # starts at once. On a push to main it runs only to save its build cache.
  check:
    needs: [changes, caches]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (github.event_name != 'push' || needs.changes.outputs.warm-rust == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-check-${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # The Rust tests render with SwiftShader through the pinned bundle.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      - run: npm ci
      - run: npm run lint:rust
      - run: npm run lint:js
      - run: cargo test --workspace --exclude oxgl-node --locked

  # Host-independent checks, run once.
  repo-checks:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: python3 angle/scripts/check_pin.py
      - run: python3 angle/scripts/test_bump.py
      - run: npm ci
      # Checksums come from install-action's manifest; with no fallback, a
      # version it does not list fails here instead of downloading unverified.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-about@${{ env.CARGO_ABOUT_VERSION }}
          fallback: none
      - run: npm run lint:licenses

  # The Node test suite with the build's packages, on every platform on Node
  # 24, and on Linux arm64 also on both ends of `engines`. N-API makes the
  # addon independent of the Node version, so Linux alone covers the range.
  # On Linux it also runs on ANGLE's OpenGL ES backend (openspec
  # continuous-integration, "OpenGL ES backend legs"). `backend` is a matrix
  # key, so each gles entry overrides it and makes a leg of its own instead of
  # merging into a software leg; an entry that already makes its own leg names
  # it, since it gets no key it doesn't name.
  node-test:
    needs: [changes, build]
    # Explicit, since the default success() would also see the skipped
    # caches job that build waits for.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'push' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-15, windows-2025, windows-11-arm]
        node: [24]
        backend: [software]
        include:
          - os: ubuntu-24.04-arm
            node: 22.22.2
            backend: software
          - os: ubuntu-24.04-arm
            node: 26
            backend: software
          - os: ubuntu-24.04
            node: 24
            backend: gles
          - os: ubuntu-24.04-arm
            node: 24
            backend: gles
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conformance runner's harness tests decode videos with ffmpeg.
      - uses: ./.github/actions/install-ffmpeg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The run's main package and this platform's (see build).
      - uses: ./.github/actions/use-packages
        with:
          runner: ${{ matrix.os }}
      - uses: ./.github/actions/use-gles-addon
        if: matrix.backend == 'gles'
      - run: npm test
        env:
          OXGL_BACKEND: ${{ matrix.backend }}
      # With Mesa's lavapipe as the only Vulkan device, 'auto' opens the GPU
      # display, rejects it as a CPU and terminates it, and SwiftShader then
      # initializes the display it shares (openspec backend-selection, "A GPU
      # display rejected as a CPU holds nothing"). Only a run without
      # OXGL_BACKEND reaches that path.
      - name: Install Mesa's Vulkan driver (Linux x64)
        if: matrix.os == 'ubuntu-24.04' && matrix.backend == 'software'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends mesa-vulkan-drivers
      - name: Backend selection over lavapipe (Linux x64)
        if: matrix.os == 'ubuntu-24.04' && matrix.backend == 'software'
        run: node --test test/backend-selection.test.mjs

  # Rust test suites under AddressSanitizer + LeakSanitizer, on both Linux
  # architectures (README.md, CONTRIBUTING.md). Part of the full checks; on a
  # push to main it runs only to save its build cache.
  asan:
    needs: [changes, caches]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (github.event_name == 'push' && needs.changes.outputs.warm-rust == 'true' || github.event_name != 'push' && needs.changes.outputs.full == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # No -Zbuild-std on aarch64: it instruments compiler_builtins, whose
          # outline atomics __asan_init calls before shadow memory exists, so
          # every test binary segfaults at startup. The prebuilt std is
          # uninstrumented; heap errors are still caught through ASan's
          # allocator. fast_unwind_on_malloc=0: ANGLE's arm64 build signs
          # return addresses, which the frame-pointer unwinder cannot follow,
          # so suppressions would never see the ANGLE frames.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            build-std: false
            asan-options: ":fast_unwind_on_malloc=0"
          # x64 rebuilds std instrumented, which needs rust-src.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build-std: true
            asan-options: ""
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
      # Doctests are built by rustdoc, which reads only RUSTDOCFLAGS.
      RUSTDOCFLAGS: -Zsanitizer=address -Cforce-frame-pointers=yes
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:detect_stack_use_after_return=1${{ matrix.asan-options }}
      # Builds tests against the unstripped libraries of the pinned symbols
      # archive (verified like the bundle), so suppressions can name ANGLE
      # functions.
      OXGL_ANGLE_SYMBOLS: "1"
      # Absolute: cargo runs each test binary from its package directory.
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/lsan-suppressions.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly
        env:
          BUILD_STD: ${{ matrix.build-std }}
        run: |
          args=()
          [ "$BUILD_STD" = true ] && args+=(--component rust-src)
          rustup toolchain install "$ASAN_NIGHTLY" --profile minimal "${args[@]}"
      # LeakSanitizer matches suppressions against symbolized frames.
      - name: Locate llvm-symbolizer
        run: |
          symbolizer=$(command -v llvm-symbolizer || find /usr/lib/llvm-*/bin -name llvm-symbolizer | sort -V | tail -1)
          test -x "$symbolizer"
          echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-asan-${{ runner.arch }}-${{ env.ASAN_NIGHTLY }}-${{ hashFiles('Cargo.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      # oxgl-node is a Node addon whose tests run under Node, not cargo.
      - env:
          TARGET: ${{ matrix.target }}
          BUILD_STD: ${{ matrix.build-std }}
        run: |
          args=()
          [ "$BUILD_STD" = true ] && args+=(-Zbuild-std)
          cargo +"$ASAN_NIGHTLY" test --workspace --exclude oxgl-node --locked "${args[@]}" --target "$TARGET"

  # Both Khronos conformance suites on every supported platform, judged against
  # the conformance/expectations.txt entries that apply there (openspec
  # conformance-testing). Each platform and suite runs in parallel and uploads
  # its report whether it passes or fails.
  conformance:
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-15, windows-2025, windows-11-arm]
        suite: [webgl1, webgl2]
        # A matrix key, so each gles entry makes a leg of its own (see node-test).
        backend: [software]
        include:
          - { os: ubuntu-24.04, suite: webgl1, backend: gles }
          - { os: ubuntu-24.04, suite: webgl2, backend: gles }
          - { os: ubuntu-24.04-arm, suite: webgl1, backend: gles }
          - { os: ubuntu-24.04-arm, suite: webgl2, backend: gles }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The conformance runner decodes videos with ffmpeg.
      - uses: ./.github/actions/install-ffmpeg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The suite is fetched by its pinned commit, without line-ending
      # conversion; the cache is keyed by the pin. `-lf`: entries saved before
      # that may hold converted copies.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/conformance
          key: conformance-suite-lf-${{ hashFiles('conformance/suite.json') }}
      - run: npm ci
      # The run's main package and this platform's (see build).
      - uses: ./.github/actions/use-packages
        with:
          runner: ${{ matrix.os }}
      # macos-15 runners are slow and variable: passing pages went up to 53 s
      # between results there, so macOS gets a longer limit, which costs time
      # only for pages that stop without finishing.
      - uses: ./.github/actions/use-gles-addon
        if: matrix.backend == 'gles'
      - run: |
          args=(--suite "$SUITE")
          [ "$RUNNER_OS" = macOS ] && args+=(--timeout 180)
          npm run conformance -- "${args[@]}"
        env:
          SUITE: ${{ matrix.suite }}
          OXGL_BACKEND: ${{ matrix.backend }}
      # Artifact names must be unique within a run, hence the platform, suite
      # and backend suffix.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-results-${{ matrix.os }}-${{ matrix.suite }}${{ matrix.backend == 'gles' && '-gles' || '' }}
          path: conformance-results.json

  # three.js r186's own WebGL examples on every supported platform, each frame
  # judged against the release's reference screenshot and the
  # threejs/expectations.txt entries that apply there (openspec
  # threejs-examples). Runs alongside the conformance jobs; uploads its report
  # and failing examples' images whether it passes or fails.
  threejs:
    needs: [changes, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.changes.outputs.full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-15, windows-2025, windows-11-arm]
        # A matrix key, so each gles entry makes a leg of its own (see node-test).
        backend: [software]
        include:
          - { os: ubuntu-24.04, backend: gles }
          - { os: ubuntu-24.04-arm, backend: gles }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner refuses to start without ffmpeg, as the conformance runner does.
      - uses: ./.github/actions/install-ffmpeg
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The release is fetched by its pinned commit, without line-ending
      # conversion; the cache is keyed by the pin. `-lf`: entries saved before
      # that may hold converted copies.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/threejs
          key: threejs-release-lf-${{ hashFiles('threejs/pin.json') }}
      - run: npm ci
      # The run's main package and this platform's (see build).
      - uses: ./.github/actions/use-packages
        with:
          runner: ${{ matrix.os }}
      - uses: ./.github/actions/use-gles-addon
        if: matrix.backend == 'gles'
      - run: npm run threejs
        env:
          OXGL_BACKEND: ${{ matrix.backend }}
      # Artifact names must be unique within a run, hence the platform and
      # backend suffix.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: threejs-results-${{ matrix.os }}${{ matrix.backend == 'gles' && '-gles' || '' }}
          path: |
            threejs-results.json
            threejs-output/
          if-no-files-found: ignore

  # The one check branch protection and the merge queue require. Only the
  # full-only jobs may be skipped, and only when this run isn't a full one;
  # any other skip (an upstream failure, a broken `if:`) fails the check. A
  # push to main reports none.
  ci:
    if: always() && github.event_name != 'push'
    needs: [changes, workflow-lint, build, check, repo-checks, node-test, asan, conformance, threejs]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every needed job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e '
            (.changes.outputs.full == "false") as $quick
            | all(to_entries[];
                .value.result == "success"
                or (.value.result == "skipped" and $quick
                    and (.key | IN("asan", "conformance", "threejs"))))'

  # Publishes a version npm doesn't have yet, from the tarballs the tested
  # run's build jobs packed and smoke-tested and its test jobs ran (openspec
  # release): on a push, the passing merge group run for this commit; on a
  # manual run on main, this run. Then builds the results page from that run's
  # reports, naming the version, for the pages job. Trusted publishing: npm
  # accepts this job's OIDC token for the `npm` environment, which only main
  # may deploy to, so no npm token exists. A rerun publishes only what a failed
  # run left out.
  release:
    needs: [changes, ci]
    if: >-
      ${{ !cancelled() && needs.changes.outputs.release == 'true' && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && needs.ci.result == 'success') }}
    runs-on: ubuntu-24.04
    environment: npm
    # Serializes overlapping runs on main; never cancel a publish.
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      # To download the merge group run's artifacts.
      actions: read
    outputs:
      page: ${{ steps.page.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 has
      # bundled since 24.5.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Find the merge group run that tested this commit
        id: source
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$GITHUB_SHA&status=success" \
            --jq '.workflow_runs[0].id // empty')"
          if [ -z "$id" ]; then
            echo "::error::no passing merge group run tested $GITHUB_SHA (merged past the queue?); start ci manually on main to build, test and release it"
            exit 1
          fi
          echo "run-id=$id" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{package-main,packages-*}"
          path: packages
          merge-multiple: true
          run-id: ${{ steps.source.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - run: node scripts/release.mjs packages
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{conformance-results-*,threejs-results*}"
          path: reports
          run-id: ${{ steps.source.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Build the results page
        id: page
        run: |
          version="$(jq -r .version package.json)"
          node scripts/results-page.mjs --commit "$GITHUB_SHA" --version "$version" reports site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Builds the results page (openspec results-page) after the suites, also
  # when they fail, as a run artifact; the release builds the published one.
  # Not part of `ci`: a page-builder bug must not block merges, and node-test
  # tests the builder.
  results:
    needs: [changes, conformance, threejs]
    if: ${{ !cancelled() && needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{conformance-results-*,threejs-results*}"
          path: reports
      - name: Build the page
        run: |
          mkdir -p reports
          node scripts/results-page.mjs --commit "$GITHUB_SHA" reports site/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-page
          path: site/index.html
          if-no-files-found: error

  # Publishes the page the release built to GitHub Pages, from main only. The
  # only job with pages: write and id-token: write.
  pages:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.page == 'true' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Deploys one at a time; never cancel one that has started.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Saves, on each platform, the download caches the full checks restore,
  # since only runs on main save caches that other runs can restore (openspec
  # continuous-integration, "Caches are warmed from main"). Each cache saves
  # only when its key missed. The bundle cache comes from oxgl-sys's own
  # build script, with the AddressSanitizer symbols on Linux, since asan shares
  # that key. build, check and asan run after it on the same push when the
  # Rust build caches need saving.
  caches:
    needs: changes
    if: github.event_name != 'merge_group' && github.event_name != 'pull_request' && needs.changes.outputs.warm-inputs == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04, macos-15, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/oxgl-angle
          key: angle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('angle/bundles.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/conformance
          key: conformance-suite-lf-${{ hashFiles('conformance/suite.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/threejs
          key: threejs-release-lf-${{ hashFiles('threejs/pin.json') }}
      # repo-checks' Cargo downloads, which cargo check below fills.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.os == 'ubuntu-24.04'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('Cargo.lock') }}
      - run: npm ci
      - name: Fetch the pinned bundle
        run: |
          [ "$RUNNER_OS" = Linux ] && export OXGL_ANGLE_SYMBOLS=1
          cargo check -p oxgl-sys --locked
      - name: Fetch the pinned suites
        run: |
          node --input-type=module -e "import { ensureSuite } from './conformance/suite.mjs'; ensureSuite();"
          node --input-type=module -e "import { ensureRelease } from './threejs/release.mjs'; ensureRelease();"
