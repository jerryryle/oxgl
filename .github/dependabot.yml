# Proposes bumps for the SHA-pinned actions in .github/workflows and in this
# repository's own actions under .github/actions (keeping the trailing version
# comments in sync). Rust and npm dependencies are updated by
# hand: a bump can require regenerating THIRD_PARTY_NOTICES.
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
