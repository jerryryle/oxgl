# Settings for the zizmor audit in ci.yml's workflow-lint job.
rules:
  unpinned-uses:
    config:
      # Every action, first-party included, is pinned to a full commit SHA.
      policies:
        "*": hash-pin
  # It asks for GitHub's `$/...` form (July 2026) for this repository's own
  # actions, which actionlint, up to at least v1.7.12, rejects as an action
  # without a ref (rhysd/actionlint#711). Re-enable it, and switch to `$/`,
  # once an actionlint release accepts that form.
  self-repository:
    disable: true
